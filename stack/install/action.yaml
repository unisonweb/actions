# Reference:
# https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: Install Stack
description: Install stack for Linux, macOS, and Windows

inputs:
  stack-version:
    description: The version of stack to install, e.g. 2.9.1
    required: true
    default: 2.9.1
  token:
    description: >
      The token to download the release with. The job's own token is enough,
      since Stack's releases are public; it gives the download the workflow
      repository's rate limit instead of the one anonymous requests from a
      runner share.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: name the stack release
      shell: bash
      run: |
        if [[ ${{runner.os}} = 'Windows' ]]; then
          stack_os="windows"
        elif [[ ${{runner.os}} = 'macOS' ]]; then
          stack_os="osx"
        elif [[ ${{runner.os}} = 'Linux' ]]; then
          stack_os="linux"
        else
          echo "Unsupported OS: ${{runner.os}}"
          exit 1
        fi
        if [[ ${{runner.arch}} = 'X64' ]]; then
          stack_arch="x86_64"
        elif [[ ${{runner.arch}} = 'ARM64' ]]; then
          stack_arch="aarch64"
        else
          echo "Unsupported architecture: ${{runner.arch}}"
          exit 1
        fi
        echo "stack_release=stack-${{inputs.stack-version}}-${stack_os}-${stack_arch}" >> $GITHUB_ENV

    # Once a job has downloaded this release, later jobs take it from the
    # cache and don't reach the release server at all.
    - name: restore stack from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/stack
        key: stack-install-${{ env.stack_release }}

    - name: install stack
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        mkdir -p stack && cd stack
        if [[ ! -d "$stack_release" ]]; then
          archive="$stack_release.tar.gz"
          # Authenticated first; then anonymously, with retries. --fail makes an
          # error response an error, instead of bytes handed to tar.
          gh release download "v${{inputs.stack-version}}" --repo commercialhaskell/stack \
              --pattern "$archive" --output "$archive" --clobber \
            || curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 --output "$archive" \
              "https://github.com/commercialhaskell/stack/releases/download/v${{inputs.stack-version}}/$archive"
          tar -xzf "$archive"
          rm "$archive"
        fi
        echo "$PWD/$stack_release" >> $GITHUB_PATH
        echo "stack_path=$PWD/$stack_release" >> $GITHUB_ENV
